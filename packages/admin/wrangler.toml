name = "barnacle-admin"
main = "src/index.ts"
compatibility_date = "2024-01-17"

[[kv_namespaces]]
binding = "SESSIONS"
id = "placeholder-replace-with-real-id"

[vars]
GITHUB_OAUTH_CLIENT_ID = ""
GIT_INTEGRATION_URL = "https://barnacle-git-integration.workers.dev"
BUILDER_URL = "https://builder.example.com"

# Secrets (set via wrangler secret put):
# GITHUB_OAUTH_CLIENT_SECRET
# SESSION_SECRET
# ADMIN_ALLOWED_EMAILS - comma-separated list of allowed GitHub emails
